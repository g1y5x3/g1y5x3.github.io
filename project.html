---
layout: default
title: Project
---
<h1>Project</h1>
<ul style="margin: 0%;">
  {% for project in site.projects %}
    <li style="list-style-type: none;">
      <h3 style="padding: 0%;"><span style="opacity: 0.5;">{{ project.date | date: "%b %d, %y" }} |</span> <a href="{{ project.url }}">{{ project.title }}</a></h3>
    </li>
  {% endfor %}
</ul>
