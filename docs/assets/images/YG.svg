<svg width="200" height="100" viewBox="20 2 60 46" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* <![CDATA[ */
    :root {
      /* ⚪ Default (Light Mode) Colors */
      --highlight-color: #3498db; /* A bright blue */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* ⚫ Dark Mode Colors */
        --highlight-color: #5dade2; /* A slightly lighter blue for dark BG */
      }
    }

    /* General text styling */
    .logo-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: bold;
      dominant-baseline: central;
      text-anchor: middle;
    }
    /* ]]> */
  </style>

  <text x="38" y="25" class="logo-text" fill="var(--highlight-color)">Y</text>
  
  <text x="64" y="25" class="logo-text" fill="var(--highlight-color)">G</text>
</svg>