---
layout: default
---
<h2>{{ page.title }}</h2>
<p style="opacity: 0.5;"><span class="post-date">{{ page.date | date: "%b %d, %y" }}</span></p>
<hr style="opacity: 0.5;">
{% if page.katex %}
<!-- CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
<!-- JavaScript -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@latest/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{ delimiters: [ { left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }, { left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false } ]});">
</script>
{% endif %}
<div class="post-content">
  {{ content }}
</div>
